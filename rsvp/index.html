<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantau Ucapan & RSVP</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        object { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <object type="text/html"></object>

    <script>
        // Mengambil parameter (?id=151998) dari URL reseller
        const urlParams = window.location.search;
        const objectElem = document.querySelector('object');
        
        // Tembak ke link RSVP asli milik vendor
        objectElem.data = "https://digiowlinvitation.site/public/rsvp/" + urlParams;
    </script>
</body>
</html>
