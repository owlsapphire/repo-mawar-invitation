<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Nama Tamu</title>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #ffffff;
            position: relative;
        }
        
        /* Menampilkan halaman generator asli */
        object { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }

        /* STIKER PENUTUP: Kotak putih untuk menutupi link DigiOwl asli */
        .masking-tape {
            position: absolute;
            /* Posisi ini pas berada di atas teks URL Anda di komputer & HP */
            top: 485px; 
            left: 140px;
            width: 400px;
            height: 25px;
            background-color: #ffffff; /* Warna putih biar menyatu dengan background kotak */
            display: flex;
            align-items: center;
            z-index: 9999;
            pointer-events: none; /* Biar gak mengganggu klik */
        }

        /* Teks pengganti yang murni menampilkan domain reseller lu */
        .reseller-text {
            color: #0056b3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            font-weight: bold;
            text-decoration: underline;
        }

        /* Responsif untuk layar HP/Mobile agar posisi stiker tidak geser */
        @media screen and (max-width: 768px) {
            .masking-tape {
                top: 615px; /* Menyesuaikan tinggi kotak versi mobile */
                left: 35px;
                width: 80%;
            }
            .reseller-text {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Stiker Penutup Gaib -->
    <div class="masking-tape">
        <span class="reseller-text" id="customDomain">Loading domain...</span>
    </div>

    <!-- Website Vendor Asli -->
    <object id="generatorObject" type="text/html"></object>

    <script>
        // 1. Ambil nama project klien (misal: ovin-sigit)
        const urlParams = window.location.search;
        const params = new URLSearchParams(urlParams);
        const idKlien = params.get('id') || 'ovin-sigit';

        // 2. Tampilkan domain vercel reseller lu secara otomatis di stiker
        const currentDomain = window.location.origin;
        document.getElementById('customDomain').innerText = currentDomain + "/" + idKlien;
        
        // 3. Tampilkan halaman asli vendor di belakang layar
        const objectElem = document.getElementById('generatorObject');
        objectElem.data = "https://digiowlinvitation.site/send/" + urlParams;
    </script>
</body>
</html>
