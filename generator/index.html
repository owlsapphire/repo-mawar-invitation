<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Nama Tamu</title>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: #f4f6f9;
            position: relative;
        }
        
        /* Frame luar buat nampung web asli vendor */
        .wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        object { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }

        /* BANNER PENUTUP: Kotak putih mutlak buat menyensor link DigiOwl asli */
        .sensor-link {
            position: absolute;
            /* Posisi koordinat ini pas banget menimpa baris "URL Anda:" di desktop & mobile */
            top: 483px; 
            left: 50%;
            transform: translateX(-50%);
            width: 530px; /* Lebar pas buat nutupin satu baris penuh */
            height: 28px;
            background-color: #ffffff; /* Warna putih polos biar menyatu sama background kotak */
            z-index: 9999;
            pointer-events: none; /* Biar klien tetep bisa ngeklik area sekitarnya */
            display: flex;
            align-items: center;
            padding-left: 15px;
        }

        .teks-domain-lu {
            color: #0056b3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            font-weight: 500;
        }

        /* Penyesuaian khusus kalau klien buka lewat HP (Layar Kecil) */
        @media screen and (max-width: 768px) {
            .sensor-link {
                top: 615px; 
                width: 85%;
                padding-left: 5px;
            }
            .teks-domain-lu {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Banner Sensor Gaib: Menimpa pas di atas tulisan DigiOwl -->
        <div class="sensor-link">
            <span class="teks-domain-lu" id="domainReseller">Menghubungkan link...</span>
        </div>

        <!-- Menampilkan Halaman Generator Asli DigiOwl -->
        <object id="generatorObject" type="text/html"></object>
    </div>

    <script>
        // 1. Ambil ID klien dari URL (misal: ?id=ovin-sigit)
        const urlParams = window.location.search;
        const params = new URLSearchParams(urlParams);
        const idKlien = params.get('id') || 'ovin-sigit';

        // 2. Deteksi domain Vercel lu secara otomatis buat dipasang di banner sensor
        const domainAsliLu = window.location.origin;
        document.getElementById('domainReseller').innerText = "URL Anda: " + domainAsliLu + "/" + idKlien;
        
        // 3. Tembak halaman asli generator vendor biar fitur Excel & database-nya jalan
        const objectElem = document.getElementById('generatorObject');
        objectElem.data = "https://digiowlinvitation.site/send/" + urlParams;
    </script>
</body>
</html>
