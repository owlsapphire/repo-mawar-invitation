<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Nama Tamu</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
        object { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- Kita balik pake object sakti, tapi ditambahin script oper parameter -->
    <object id="generatorObject" type="text/html"></object>

    <script>
        // Tangkap parameter (?id=ovin-sigit) dari URL Vercel lu
        const urlParams = window.location.search;
        const objectElem = document.getElementById('generatorObject');
        
        // Langsung tembak paksa ke generator vendor lewat object pemicu
        objectElem.data = "https://digiowlinvitation.site/send/" + urlParams;
    </script>
</body>
</html>
