<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Nama Tamu Undangan</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fddde6; /* Warna pink coquette khas brand lu */
            color: #1c2033;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            border: 4px solid #1c2033;
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 8px 8px 0px #1c2033;
        }
        h2 {
            margin-top: 0;
            font-size: 22px;
            text-align: center;
            color: #1c2033;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 13px;
            text-align: center;
            margin-bottom: 25px;
            opacity: 0.8;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 3px solid #1c2033;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            background-color: #fff;
        }
        textarea {
            height: 120px;
            resize: none;
        }
        input:focus, textarea:focus {
            outline: none;
            background-color: #fff0f5;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #e390ba; /* Hot pink cerah */
            color: #1c2033;
            font-weight: bold;
            font-size: 15px;
            border: 3px solid #1c2033;
            border-radius: 12px;
            box-shadow: 4px 4px 0px #1c2033;
            cursor: pointer;
            transition: all 0.1s;
        }
        .btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px #1c2033;
        }
        .result-box {
            margin-top: 25px;
            background-color: #f7f9fa;
            border: 2px dashed #1c2033;
            border-radius: 12px;
            padding: 15px;
            display: none;
        }
        .result-box.active {
            display: block;
        }
        .alert-success {
            color: #28a745;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Generator Nama Tamu</h2>
    <p>Bikin link nama tamu undangan otomatis untuk disebar via WhatsApp.</p>
    
    <div class="form-group">
        <label for="tamuInput">Nama Tamu / Kelompok:</label>
        <input type="text" id="tamuInput" placeholder="Contoh: Budi Nugroho & Pasangan">
    </div>
    
    <button class="btn" onclick="generateLink()">✨ Buat & Salin Teks WhatsApp ✨</button>
    
    <div class="result-box" id="resultBox">
        <label>Hasil Teks Kirim WA (Sudah Disalin):</label>
        <textarea id="resultText" readonly></textarea>
        <div class="alert-success" id="successLabel">✓ Berhasil disalin ke clipboard!</div>
    </div>
</div>

<script>
    function generateLink() {
        const tamuName = document.getElementById('tamuInput').value.trim();
        if (!tamuName) {
            alert('Masukkan nama tamunya dulu ya kak!');
            return;
        }

        // 1. Ambil ID klien dari URL (?id=ovin-sigit)
        const params = new URLSearchParams(window.location.search);
        const invitationId = params.get('id') || 'ovin-sigit';

        // 2. Deteksi domain Vercel reseller secara otomatis
        const currentDomain = window.location.origin;

        // 3. Racik link undangannya murni pake domain reseller lu
        // Mengubah spasi dan karakter khusus jadi format URL (+ atau %20)
        const encodedName = encodeURIComponent(tamuName).replace(/%20/g, '+');
        const finalInvitationLink = `${currentDomain}/${invitationId}?to=${encodedName}`;

        // 4. Susun format template pesan WhatsApp-nya
        const waTemplate = `Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami.\n\nBerikut link undangan digital resmi kami:\n${finalInvitationLink}\n\nMerupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir. Terima kasih.`;

        // 5. Tampilkan hasilnya ke kotak teks
        document.getElementById('resultText').value = waTemplate;
        document.getElementById('resultBox').classList.add('active');

        // 6. Otomatis salin ke clipboard HP / Laptop user
        navigator.clipboard.writeText(waTemplate).then(() => {
            const successLabel = document.getElementById('successLabel');
            successLabel.style.display = 'block';
            setTimeout(() => {
                successLabel.style.display = 'none';
            }, 3000);
        });
    }
</script>

</body>
</html>
