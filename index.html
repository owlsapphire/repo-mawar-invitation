<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Menuju Undangan...</title>
    <script>
        // Mengambil parameter nama tamu (?to=...) dari URL reseller
        const urlParams = window.location.search;
        
        // Link target asli dari vendor lu
        const targetVendor = "https://digiowlinvitation.site/tiwi-usamah/";
        
        // Menggabungkan link vendor dengan nama tamu, lalu otomatis redirect kilat
        window.location.href = targetVendor + urlParams;
    </script>
</head>
<body>
    <p style="text-align: center; font-family: sans-serif; margin-top: 50px; color: #1c2033;">
        Loading Wedding Invitation...
    </p>
</body>
