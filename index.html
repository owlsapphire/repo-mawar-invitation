<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard RSVP Klien</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #fddde6; /* Warna Soft Pink khas lu */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header atas biar kelihatan profesional punya brand lu */
        .header-pink {
            background-color: #ffffff;
            border-bottom: 4px solid #1c2033;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 999;
        }

        .brand-text {
            font-weight: bold;
            font-size: 15px;
            color: #1c2033;
        }

        .password-hint {
            background-color: #fff0f5;
            border: 2px solid #1c2033;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        /* Container Pembungkus Layar Utama */
        .main-frame-area {
            flex: 1;
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .window-brutalism {
            width: 100%;
            max-width: 600px;
            height: 100%;
            background: #ffffff;
            border: 4px solid #1c2033;
            border-radius: 20px;
            box-shadow: 6px 6px 0px #1c2033;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .window-top-bar {
            background: #e390ba;
            padding: 8px 15px;
            border-bottom: 4px solid #1c2033;
            color: #1c2033;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* Menggunakan iframe murni agar tombol submit data berfungsi normal */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Header Brand Reseller Pink -->
    <div class="header-pink">
        <div class="brand-text"><i class="fas fa-heart" style="color: #e390ba;"></i> Henna Invitation Reseller</div>
        <div class="password-hint"><i class="fas fa-key"></i> Default Pass: 123456</div>
    </div>

    <!-- Area Konten Jendela Dashboard -->
    <div class="main-frame-area">
        <div class="window-brutalism">
            <div class="window-top-bar">
                <i class="fas fa-database"></i> DATA REALTIME KEHADIRAN & UCAPAN
            </div>
            <div class="iframe-container">
                <!-- Kita muat halaman login asli vendor lewat iframe -->
                <iframe id="rsvpIframe"></iframe>
            </div>
        </div>
    </div>

    <script>
        // Tangkap id dari url vercel lu (?id=151998)
        const urlParams = window.location.search;
        
        // Pasang link tujuannya langsung ke halaman rsvp publik milik vendor
        // Menggunakan iframe menjamin proses submit form password tidak akan mental/blank
        document.getElementById('rsvpIframe').src = "https://digiowlinvitation.site/public/rsvp/" + urlParams;
    </script>
</body>
</html>
