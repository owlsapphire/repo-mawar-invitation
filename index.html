<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Reseller - Moonlit Cascade</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3c5d8; /* Warna pink khas DigiOwl */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #1c2033;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }
        /* Desain Frame HP biar estetik */
        .phone-mockup {
            width: 360px;
            height: 740px;
            border: 8px solid #1c2033; /* Border tebal Neo-Brutalist */
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 10px 10px 0px #1c2033; /* Shadow kaku khas brand lu */
            background: #fff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>✨ Coba Tema "Moonlit Cascade" ✨</h1>

    <!-- Jendela iFrame di dalam Mockup HP -->
    <div class="phone-mockup">
        <iframe 
            src="https://digiowlinvitation.site/moonlit-cascade-tf/?to=Nama+Tamu" 
            scrolling="yes">
        </iframe>
    </div>

</body>
</html>
